
services:
  # ===========================================
  # MIRROR SERVICE (Puppeteer)
  # ===========================================
  verdict-mirror:
    build:
      context: ./mirror
      dockerfile: Dockerfile
    container_name: verdict-mirror
    restart: always
    ports:
      - "3099:3099"
    environment:
      - PORT=3099
    networks:
      - verdict-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

  # ===========================================
  # FRONTEND (Next.js)
  # ===========================================
  verdict-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        REDIS_PASSWORD: ${REDIS_PASSWORD}
    image: verdict-frontend:latest
    container_name: verdict-frontend
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://verdict.run
      - REDIS_HOST=verdict-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JUDGE0_URL=http://verdict-judge0-server:2358
      - MIRROR_SERVICE_URL=http://verdict-mirror:3099
      - SMTP_SERVER=icpchue-mailserver
      - SMTP_PORT=25
    env_file:
      - .env
    networks:
      - icpchue-network
      - verdict-network
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - verdict-mirror
      - verdict-redis
      - verdict-judge0-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  verdict-redis:
    image: redis:7.2-alpine
    container_name: verdict-redis
    command: ["redis-server", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - icpchue-network
      - verdict-network
    restart: always

  # ===========================================
  # JUDGE0 - SHARED CODE EXECUTION ENGINE
  # ===========================================
  verdict-judge0-server:
    image: mrkushalsm/judge0:latest
    container_name: verdict-judge0-server
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    env_file:
      - ./judge0/judge0.conf
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    depends_on:
      - verdict-judge0-db
      - verdict-redis
    networks:
      - icpchue-network
      - verdict-network
    restart: always
    security_opt:
      - seccomp:unconfined

  verdict-judge0-worker:
    image: mrkushalsm/judge0:latest
    container_name: verdict-judge0-worker
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup
    privileged: true
    cgroup: host
    depends_on:
      - verdict-judge0-db
      - verdict-redis
    networks:
      - icpchue-network
      - verdict-network
    restart: always
    security_opt:
      - seccomp:unconfined

  verdict-judge0-worker-2:
    image: mrkushalsm/judge0:latest
    container_name: verdict-judge0-worker-2
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup
    privileged: true
    cgroup: host
    depends_on:
      - verdict-judge0-db
      - verdict-redis
    networks:
      - icpchue-network
      - verdict-network
    restart: always
    security_opt:
      - seccomp:unconfined

  verdict-judge0-db:
    image: postgres:16.2-alpine
    container_name: verdict-judge0-db
    env_file: ./judge0/judge0.conf
    environment:
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0secret
    volumes:
      - verdict-judge0-db-data:/var/lib/postgresql/data
    networks:
      - icpchue-network
      - verdict-network
    restart: always

# ===========================================
# NETWORKS
# ===========================================
networks:
  icpchue-network:
    external: true
    name: icpchue_icpchue-network
  verdict-network:
    driver: bridge

# ===========================================
# VOLUMES
# ===========================================
volumes:
  verdict-judge0-db-data:
